channels:
  - conda-forge
  - bioconda
dependencies:
  - snakemake-minimal >=8.4.4
  - mappy
  - numpy
  - editdistance
  - tqdm
  - scipy
  - matplotlib
  - pyabpoa
  - minimap2
  - samtools
  - blat
  - subread
  - racon
  - salmon
  #  needed to build the bundled conk aligner (pip install ./conk-master)
  - pip
  - cython
  - setuptools
  - wheel
  - pip:
    #  at the time of writing - 7. Feb 24 - pysam on bioconda will require
    #  a lower python version than snakemake, install pysam
    #  using pip
    - pysam ==0.22
